<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Welcome Back - RentPG | Secure Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
        }

        .blob {
            position: fixed;
            width: 50vw;
            height: 50vw;
            border-radius: 62% 38% 72% 28% / 56% 48% 52% 44%;
            filter: blur(70px);
            z-index: 0;
            animation: floatBlob 25s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .blob-1 {
            top: -20%;
            left: -10%;
            background: radial-gradient(circle, #818cf8, #c7d2fe50);
        }

        .blob-2 {
            bottom: -15%;
            right: -5%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, #a78bfa40, #e0e7ff30);
            animation-duration: 28s;
            animation-direction: alternate-reverse;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(40px, -40px) rotate(12deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        .smooth-shadow {
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .gradient-hover {
            transition: all 0.3s ease;
        }

        .gradient-hover:hover {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        .card-glass {
            backdrop-filter: blur(2px);
            background: rgba(255, 255, 255, 0.98);
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .card-glass:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.25);
        }

        .link-hover {
            position: relative;
        }

        .link-hover::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #4f46e5;
            transition: width 0.3s ease;
        }

        .link-hover:hover::after {
            width: 100%;
        }

        .checkbox-custom:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }

        .social-icon-btn {
            transition: all 0.2s ease;
        }

        .social-icon-btn:hover {
            transform: translateY(-3px);
            background: #f0f4ff;
        }

        @media (max-width: 640px) {
            .smooth-shadow {
                margin: 0 1rem;
            }

            .blob {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body class="relative antialiased">

    <!-- Background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">

        <div class="max-w-md w-full space-y-8 bg-white/95 backdrop-blur-sm p-8 rounded-2xl smooth-shadow card-glass animate-fade-in border border-white/30">

            <!-- Header -->
            <div class="text-center">
                <div class="flex justify-center mb-4">
                    <div class="gradient-bg p-3 rounded-2xl shadow-lg shadow-indigo-200/50">
                        <i class="fas fa-building text-3xl text-white"></i>
                    </div>
                </div>

                <h2 class="text-3xl font-extrabold tracking-tight text-gray-800">
                    Welcome Back 👋
                </h2>

                <p class="mt-2 text-sm text-gray-500">
                    New to RentPG?

                    <!-- CHANGE THIS URL IF NEEDED -->
                    <a href="{% url 'register' %}"
                       class="font-semibold text-indigo-600 hover:text-indigo-800 transition link-hover">
                        Create an account
                    </a>
                </p>
            </div>

            <!-- Django messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-lg">
                        <div class="flex items-center">
                            <i class="fas fa-exclamation-circle mr-3 text-red-500"></i>
                            <span>{{ message }}</span>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Login Form -->
            <form class="mt-6 space-y-5"
                  method="POST"
                  id="loginForm">

                {% csrf_token %}

                <div class="space-y-4">

                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                            Username
                        </label>

                        <div class="relative group">

                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>

                            <input type="text"
                                   name="username"
                                   required
                                   class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-200 bg-gray-50/50 hover:bg-white"
                                   placeholder="Enter username">

                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                            Password
                        </label>

                        <div class="relative group">

                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>

                            <input type="password"
                                   name="password"
                                   required
                                   id="password"
                                   class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-200 bg-gray-50/50 hover:bg-white"
                                   placeholder="••••••••">

                            <button type="button"
                                    class="toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-indigo-500 transition">

                                <i class="fas fa-eye-slash"></i>

                            </button>

                        </div>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center justify-between">

                    <div class="flex items-center">
                        <input type="checkbox"
                               name="remember"
                               id="remember_me"
                               class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded checkbox-custom transition">

                        <label for="remember_me"
                               class="ml-2 block text-sm text-gray-700 cursor-pointer select-none">
                            Remember me
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="#"
                           class="font-medium text-indigo-600 hover:text-indigo-800 transition link-hover">
                            Forgot password?
                        </a>
                    </div>

                </div>

                <!-- Button -->
                <button type="submit"
                        class="w-full gradient-bg gradient-hover text-white py-3.5 rounded-xl font-bold text-base shadow-md shadow-indigo-200 hover:shadow-xl transition-all duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">

                    <i class="fas fa-arrow-right-to-bracket mr-2"></i>
                    Sign In

                </button>

            </form>

            <!-- Divider -->
            <div class="relative">

                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>

                <div class="relative flex justify-center text-xs">
                    <span class="px-3 bg-white/90 text-gray-400 rounded-full">
                        🔒 256-bit SSL Secure
                    </span>
                </div>

            </div>

            <!-- Social login -->
            <div class="grid grid-cols-2 gap-3 pt-2">

                <a href="#"
                   class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 rounded-xl bg-gray-50 hover:bg-gray-100 transition text-gray-600 text-sm font-medium social-icon-btn">

                    <i class="fab fa-google text-red-500"></i>
                    Google

                </a>

                <a href="#"
                   class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 rounded-xl bg-gray-50 hover:bg-gray-100 transition text-gray-600 text-sm font-medium social-icon-btn">

                    <i class="fab fa-apple text-black"></i>
                    Apple

                </a>

            </div>

            <!-- Footer -->
            <div class="text-center text-xs text-gray-400 flex items-center justify-center gap-2 mt-2">
                <i class="fas fa-shield-alt text-indigo-300"></i>
                <span>Your data is protected & encrypted</span>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script>
        // Toggle password visibility
        const toggleBtns = document.querySelectorAll('.toggle-password');

        toggleBtns.forEach(btn => {
            btn.addEventListener('click', function () {

                const input = document.getElementById('password');
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });
        });

        // Button loading effect
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', function () {

            const btn = form.querySelector('button[type="submit"]');

            btn.innerHTML =
                '<i class="fas fa-spinner fa-spin mr-2"></i> Signing in...';

            btn.disabled = true;
        });
    </script>

</body>
</html>
