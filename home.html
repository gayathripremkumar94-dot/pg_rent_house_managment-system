<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home - User Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            color: #333;
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        p {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .celebrate {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        
        a {
            display: inline-flex;
            align-items: center;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .profile-link {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .logout-link {
            background: linear-gradient(to right, #ff758c 0%, #ff7eb3 100%);
            color: white;
        }
        
        a:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        a:active {
            transform: translateY(1px);
        }
        
        a i {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        .welcome-text {
            position: relative;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .welcome-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border-radius: 3px;
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            display: none; /* Will be shown with JavaScript if user data available */
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            p {
                font-size: 1.1rem;
            }
            
            .links {
                flex-direction: column;
                gap: 15px;
            }
            
            a {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <span class="celebrate">🎉</span>
        
        <div class="welcome-text">
            <h1>Welcome Home</h1>
            <p>You have successfully logged in to your account.</p>
        </div>
        
        <div class="user-info" id="userInfo">
            <!-- User information could be displayed here -->
        </div>
        
        <div class="links">
            <a href="{% url 'profile' %}" class="profile-link">
                <i class="fas fa-user-circle"></i> Go to Profile
            </a>
            <a href="{% url 'logout' %}" class="logout-link">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <script>
        // You can use this to display user information if available
        document.addEventListener('DOMContentLoaded', function() {
            // Example of how you might display user info if you pass it from Django
            // const userInfoDiv = document.getElementById('userInfo');
            // if (userInfo) {
            //     userInfoDiv.style.display = 'block';
            //     userInfoDiv.innerHTML = `<h3>Welcome, ${userInfo.username}</h3>`;
            // }
        });
    </script>
</body>
</html>
